name: B6.5 calculateur — tests isolés
on:
  push:
    branches:
      - feature/b6-5-cartographie-interactive
    paths:
      - 'b65-calculateur/**'
      - 'b65-sqlite/**'
      - 'b65-http/**'
      - 'RECETTE-B65-PARCOURS-COMPLET.html'
      - '.github/workflows/b65-calculateur-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests calculateur sans API
        run: node --test b65-calculateur/*.test.mjs
      - name: Tests SQLite persistants hors ligne
        run: python3 -m unittest discover -s b65-sqlite -p 'test_*.py' -v
      - name: Tests façade HTTP locale hors ligne
        run: python3 -m unittest discover -s b65-http -p 'test_*.py' -v
