name: B6.5 calculateur — tests isolés
on:
  push:
    branches:
      - feature/b6-5-cartographie-interactive
    paths:
      - 'b65-calculateur/**'
      - 'RECETTE-B65-PARCOURS-COMPLET.html'
      - '.github/workflows/b65-calculateur-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests calculateur sans API
        run: node --test b65-calculateur/*.test.mjs
